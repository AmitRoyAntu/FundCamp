name: CampFund CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.WORK_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="$HOME/CampFund"
            fi
            
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Target directory does not exist. Creating and cloning repository..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/${{ github.repository }}.git "$TARGET_DIR"
            fi
            
            cd "$TARGET_DIR" || exit 1
            
            echo "Updating source code..."
            git fetch origin main
            git reset --hard origin/main
            
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            
            echo "Rebuilding and deploying containers..."
            docker compose down --remove-orphans
            docker compose up -d --build --wait
            
            echo "Cleaning up unused Docker images..."
            docker image prune -f
            
            echo "Verifying deployment health..."
            curl -f http://localhost:5001/api/health
            
            echo "CampFund deployment complete!"
