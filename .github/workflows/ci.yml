name: CampFund CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  frontend-ci:
    name: Frontend Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install & Build Frontend
        run: |
          npm ci
          npm run build
        working-directory: ./client

  backend-ci:
    name: Backend Syntax & Imports Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install & Validate Server
        run: |
          npm install
          node --check server.js
        working-directory: ./server

  docker-integration:
    name: Docker Stack Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment & Start Containers
        run: |
          cp .env.example .env
          docker compose up -d --build --wait

      - name: Verify API & Reverse Proxy Health
        run: |
          curl -f http://localhost:5001/api/health
          curl -f http://localhost:5173/api/campaigns

      - name: Clean Up Stack
        if: always()
        run: docker compose down --volumes --remove-orphans
