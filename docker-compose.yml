name: fundcamp

services:
  postgres:
    image: postgres:15-alpine
    container_name: fundcamp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/1_init.sql
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    networks:
      - fundcamp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: fundcamp-server:latest
    container_name: fundcamp_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      # AI assistant — Compose does not inject .env into containers, so every
      # var the server reads must be listed explicitly here.
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      AI_API_KEY: ${AI_API_KEY}
      AI_ENABLED: ${AI_ENABLED}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS}
      AI_ANON_HOURLY_LIMIT: ${AI_ANON_HOURLY_LIMIT}
      AI_USER_HOURLY_LIMIT: ${AI_USER_HOURLY_LIMIT}
      AI_ANON_DAILY_LIMIT: ${AI_ANON_DAILY_LIMIT}
    networks:
      - fundcamp_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: fundcamp-client:latest
    container_name: fundcamp_client
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - "80"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    networks:
      - fundcamp_network

  nginx:
    image: nginx:alpine
    container_name: fundcamp_nginx
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    networks:
      - fundcamp_network

volumes:
  postgres_data:
    name: fundcamp_postgres_data
    driver: local

networks:
  fundcamp_network:
    name: fundcamp_network
    driver: bridge
